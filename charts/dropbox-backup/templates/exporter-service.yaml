{{- if .Values.exporter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: dropbox-backup-restic-exporter
  labels:
    app: dropbox-backup-restic-exporter
spec:
  selector:
    app: dropbox-backup-restic-exporter
  ports:
    - name: metrics
      port: {{ .Values.exporter.port }}
      targetPort: metrics
{{- end }}
