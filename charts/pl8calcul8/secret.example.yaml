# EXAMPLE ONLY - documents the Secret that templates/deployment.yaml expects.
# The real Secret is created manually and lives only in the cluster, never in
# git. Create it imperatively (save the token to your password manager first -
# the app needs the same token to authenticate):
#
#   BACKUP_TOKEN="$(openssl rand -base64 32)"; echo "$BACKUP_TOKEN"  # save this
#   kubectl create namespace pl8calcul8
#   kubectl create secret generic pl8calcul8-secrets \
#     --namespace pl8calcul8 \
#     --from-literal=backup-token="$BACKUP_TOKEN"
#
apiVersion: v1
kind: Secret
metadata:
  name: pl8calcul8-secrets
  namespace: pl8calcul8
type: Opaque
stringData:
  # Static bearer token shared between the Android app and this server.
  backup-token: "REPLACE_ME_with_a_long_random_token"
