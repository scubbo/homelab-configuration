# EXAMPLE ONLY - documents the Secret that templates/deployment.yaml expects.
# The real Secret is created manually and lives only in the cluster, never in
# git.
#
# The value is a comma-separated list of name:token pairs - one isolated
# backup "track" per user. Track names become directory names on the data
# volume (letters, digits, _, - only). Generate each token with
# `openssl rand -base64 32` and save it to a password manager; each user
# enters their own token in the app.
#
# Create (or update) imperatively:
#
#   kubectl create secret generic pl8calcul8-secrets \
#     --namespace pl8calcul8 \
#     --from-literal=backup-tokens="jack:REPLACE_ME,anna:REPLACE_ME_TOO" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
apiVersion: v1
kind: Secret
metadata:
  name: pl8calcul8-secrets
  namespace: pl8calcul8
type: Opaque
stringData:
  # name:token pairs, comma-separated. Shared between this server and the
  # users' apps (each user configures their own token).
  backup-tokens: "jack:REPLACE_ME_with_a_long_random_token"
