set default=0
set timeout=3
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial
menuentry 'Debian network-probe unattended installation' {
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed.cfg console=tty0 console=ttyS0,115200n8 --- console=tty0 console=ttyS0,115200n8
    initrd /install.amd/initrd.gz
}
