apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-gluetun-sidecar
  annotations:
    policies.kyverno.io/title: Inject Gluetun VPN Sidecar
    policies.kyverno.io/category: Security
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      This policy automatically injects a Gluetun VPN sidecar container
      into all Pods created in the 'vpn' namespace or all pods labelled with `gluetun-vpn: "true"`, using ProtonVPN configuration.
spec:
  background: false
  rules:
  - name: inject-gluetun-container
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - vpn
      - resources:
          kinds:
          - Pod
          selector:
            matchLabels:
              gluetun-vpn: "true"
    exclude:
      any:
      - resources:
          annotations:
            gluetun.kyverno.io/skip: "true"
      - resources:
          kinds:
          - Pod
          name: "*gluetun*"  # Skip pods that already have gluetun in the name
    mutate:
      patchStrategicMerge:
        metadata:
          annotations:
            setGateway: "false"  # Disable pod-gateway webhook injection
        spec:
          containers:
          - name: gluetun
            image: qmcgaw/gluetun@sha256:fdf049f80bf452aaba54ae89fb95d104bf0f48e469cc167e79c089b63e80d770
            securityContext:
              capabilities:
                add:
                - NET_ADMIN
            env:
            - name: VPN_SERVICE_PROVIDER
              value: "protonvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-protonvpn
                  key: wireguard-private-key
            # Canada rather than Netherlands: NNTP through Proton NL exits is
            # throttled to ~0.4 MB/s (any usenetserver farm, port 563 or 443)
            # while plain HTTP through the same tunnel sustains 11 MB/s. A
            # different exit region tests whether the shaping is NL-specific.
            # See agentic-investigations/2026-07-12-gluetun-vpn-throughput-collapse.md
            - name: SERVER_COUNTRIES
              value: "Canada"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.0.0.0/8,192.168.0.0/16"
            ports:
            - containerPort: 8000
              name: gluetun-http
              protocol: TCP